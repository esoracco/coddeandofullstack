<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto</title>

  <link rel="stylesheet" href="../css/global.css">
  <!-- CDN de Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

  <!-- Encabezado / Navbar opcional -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Mi Sitio Web</a>
      </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h2 class="h4 mb-0 text-center">Formulario de Contacto</h2>
          </div>
          <div class="card-body p-4">
            
            <form id="contactoForm">
              <!-- Campo: Nombre -->
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Enzo Pérez" required>
              </div>

              <!-- Campo: Teléfono -->
              <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej: +56 9 1234 5678" required>
              </div>

              <!-- Campo: País -->
              <div class="mb-3">
                <label for="pais" class="form-label">País</label>
                <select class="form-select" id="pais" name="pais" required>
                  <option value="" selected disabled>Selecciona tu país</option>
                  <option value="Chile">Chile</option>
                  <option value="Argentina">Argentina</option>
                  <option value="Perú">Perú</option>
                  <option value="Colombia">Colombia</option>
                  <option value="México">México</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>

              <!-- Campo: Provincia / Región -->
              <div class="mb-3">
                <label for="provincia" class="form-label">Provincia / Región</label>
                <input type="text" class="form-control" id="provincia" name="provincia" placeholder="Ej: Región Metropolitana / Buenos Aires" required>
              </div>

              <!-- Campo: Comentario -->
              <div class="mb-3">
                <label for="comentario" class="form-label">Comentario o mensaje</label>
                <textarea class="form-rows=4" class="form-control" id="comentario" name="comentario" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
              </div>

              <!-- Botón Envío -->
              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Enviar mensaje</button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">&copy; 2026 Mi App Express - Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- CDN de Bootstrap 5.3 JS (con Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- link a js para enviar el formulario -->
  <script src="../js/contacto.js"></script>
</html>
