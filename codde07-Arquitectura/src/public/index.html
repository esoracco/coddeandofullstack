<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practicas Coddeando</title>

    <!-- 1. CSS de Bootstrap (Versión oficial estable 5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- 2. Tu CSS propio siempre va abajo de Bootstrap -->
    <link rel="stylesheet" href="./css/global.css">
</head>
<body>
    <header> 
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="./pages/productos.html">Productos</a></li>
                <li><a href="./pages/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-4">
        <h1 class="miCSS">Bienvenido a mi sitio web</h1>
        <p class="text-center">Este es un sitio web de ejemplo creado para practicar HTML y CSS.</p>

        <div id="carouselExampleFade" class="carousel slide container">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/800/400?random=1" class="d-block w-100 vh75" alt="Slide 1">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/800/400?random=2" class="d-block w-100 vh75" alt="Slide 2">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/800/400?random=3" class="d-block w-100 vh75" alt="Slide 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container">
        <p class="mb-1">© 2026 Practicas Coddeando. Todos los derechos reservados.</p>
        <small class="text-secondary">Desarrollado en el Bootcamp Full-Stack</small>
    </div>
</footer>
