<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>Formularios - Flex</title>
</head>
<body>
    <header>
        <form id="contact-form" action="#" method="post">
            <div class="form-field">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-field">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-field">
                <button type="submit">Enviar</button>
            </div>
        </form>
    </header>

    <main>
        <h1>Bienvenido a nuestro sitio web</h1>
        <p>Este es un ejemplo de una estructura HTML correcta.</p>

        <div class="flex-container">
            <div class="foto">
                <img src="https://picsum.photos/200/200" alt="Imagen 1">
            </div>
            <div class="foto">
                <img src="https://picsum.photos/200/200" alt="Imagen 2">
            </div>
            <div class="flex-item foto">
                <img src="https://picsum.photos/200/200" alt="Imagen 3">
            </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 4">
            </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 6">
                </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 7">
                </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 8">
                </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 9">
                </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 10">
                </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 11">
                </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 12">
                </div>
            <div class="flex-item">
                <img src="https://picsum.photos/200/200" alt="Imagen 13">
                </div>

        <h2>Formulario de contacto</h2>

</body>
</html>
