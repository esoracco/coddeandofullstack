<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Admin - Ventas</title>
</head>
<body>
  <header>
    <h1>Panel de Administración — Ventas</h1>
  </header>

  <main>
    <div class="toolbar">
      <button id="btn-new">Nueva venta</button>
      <input id="search" placeholder="Buscar por cliente o producto">
    </div>

    <table id="sales-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="form-modal" class="modal hidden">
      <form id="sale-form">
        <h2 id="form-title">Nueva venta</h2>
        <input type="hidden" id="sale-id">
        <label>Cliente
          <input id="cliente" required>
        </label>
        <label>Producto
          <input id="producto" required>
        </label>
        <label>Cantidad
          <input id="cantidad" type="number" min="1" value="1" required>
        </label>
        <label>Precio
          <input id="precio" type="number" min="0" step="0.01" value="0" required>
        </label>
        <label>Fecha
          <input id="fecha" type="date" required>
        </label>
        <div class="actions">
          <button type="submit">Guardar</button>
          <button type="button" id="cancel">Cancelar</button>
        </div>
      </form>
    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
