<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    
    <h1>Formulario de Registro</h1>

    <!-- etiqueta padre del formulario, todos los datos deben estar dentro de esta etiqueta -->
     <form action="">
        <!-- etiqueta para el campo de texto -->
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><!-- obligatorio -->

        <br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required><!-- obligatorio -->
        <br>

        <br>
        <button type="submit">Enviar</button>
     </form>
</body>
</html>
