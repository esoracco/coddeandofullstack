  <h1 class="text-center mt-5 mb-5">Formulario de Registro</h1>

  <!-- Etiqueta padre del formulario, todos los datos que necesito, deben estar dentro de esta etiqueta -->
  <!-- method="post": especifica el método de envío del formulario -->
  <!-- action="">: especifica la URL a la que se enviarán los datos del formulario -->
  <div class="container text-center">
    <form action="" method="post">
  
      <div class="mb-3">
        <!-- etiqueta para el campo de texto, le muestra al usuario el dato que debe ingresar -->
        <label for="nombre" class="form-label">Nombre:</label>
        <!-- etiqueta para el campo de texto, donde el usuario ingresa el dato -->
        <input class="form-control w-25" type="text" id="nombre" name="nombre" required><!-- obligatorio -->
      </div>
  
      <br>
  
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico:</label>
        <input class="form-control w-50" type="email" id="email" name="email" required><!-- obligatorio -->
      </div>
  
      <br>
  
      <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input class="form-control w-75" type="password" id="password" name="password" required><!-- obligatorio -->
      </div>
  
  
      <br><!-- salto de linea -->
  
      <div mb-3>
        <button class="btn btn-primary w-25" type="button" onclick="recibirDatos()">Enviar</button>
        <button class="btn btn-danger w-25" type="reset">Limpiar</button>
      </div>
  
    </form>
  </div>
